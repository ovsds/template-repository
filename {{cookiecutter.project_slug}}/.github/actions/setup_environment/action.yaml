name: "Setup Environment"
description: "Setting environment for the project"

inputs:
  mise-version:
    description: "Mise version, tools are pinned in mise.toml"
    required: true
    default: "2026.10.15"

runs:
  using: "composite"
  steps:
    - name: Setup mise
      uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        version: ${{ "{{" }} inputs.mise-version }}
{%- if cookiecutter.scripts == 'true' or cookiecutter.services.split() or cookiecutter.with_docker == 'true' %}
        # Root tools only: `mise install --monorepo` drops a root tool another config root pins at a different version
        # (the root's python, which poetry needs); mise installs the config roots' tools when their tasks first run,
        # and the post step caches them too
        monorepo: false
        cache_save_post: true
{%- endif %}
