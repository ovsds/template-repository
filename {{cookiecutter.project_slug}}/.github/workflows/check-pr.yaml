name: Check PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ "{{" }} github.workflow }}-${{ "{{" }} github.event.number }}
  cancel-in-progress: true

jobs:
  check-pr:
    runs-on: {{ cookiecutter.github_workflow_runs_on }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
{%- if cookiecutter.with_gitleaks == 'true' %}
          fetch-depth: 0 # Gitleaks scans the whole history
{%- endif %}

      - name: Setup Environment
        uses: $/.github/actions/setup_environment

      - name: Install Dependencies
        run: |
          mise run init

      - name: Lint PR
        run: |
          mise run lint
        {%- if cookiecutter.with_zizmor == 'true' %}
        env:
          GH_TOKEN: ${{ "{{" }} secrets.GITHUB_TOKEN }} # Required for Zizmor
        {%- endif %}
      {%- if cookiecutter.with_docker == 'true' %}

      - name: Prepare auxiliary containers
        working-directory: docker
        run: |
          mise run build
          mise run start
        env:
          ENVIRONMENT: CI
      {%- endif %}

      - name: Test PR
        run: |
          mise run test
      {%- if cookiecutter.with_docker == 'true' %}

      - name: Clean up auxiliary containers
        if: success() || failure()
        working-directory: docker
        run: |
          mise run clean
        env:
          ENVIRONMENT: CI
      {%- endif %}
