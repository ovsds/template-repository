name: 🔒 Security Scan

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: 0 0 * * 0
  workflow_dispatch:

concurrency:
  group: $${{ "{{" }} github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: {{ cookiecutter.github_workflow_runs_on }}

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get latest image tag
        id: get_tag
        uses: pozetroninc/github-action-get-latest-release@v0.8.0
        with:
          owner: ${{ "{{" }} github.repository_owner }}
          repo: ${{ "{{" }} github.event.repository.name }}
          excludes: prerelease, draft

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Build & start devcontainer
        run: devcontainer up --workspace-folder .

      - name: Scan image for vulnerabilities
        id: scan
        continue-on-error: true
        env:
          IMAGE_REGISTRY: ghcr.io/${{ "{{" }} github.repository_owner }}
          IMAGE_NAME: ${{ "{{" }} github.event.repository.name }}
          IMAGE_TAG: ${{ "{{" }} steps.get_tag.outputs.release }}
        run: |
          devcontainer exec --workspace-folder . \
            --remote-env "IMAGE_REGISTRY=${IMAGE_REGISTRY}" \
            --remote-env "IMAGE_NAME=${IMAGE_NAME}" \
            --remote-env "IMAGE_TAG=${IMAGE_TAG}" \
            bash -c "task ci-image-scan | tee scan-output.txt"

      - name: Capture scan output
        id: scan-output
        if: always()
        run: |
          {
            echo 'stdout<<EOF'
            cat scan-output.txt 2>/dev/null || echo "(scan output unavailable)"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report vulnerabilities
        uses: ovsds/create-or-update-unique-issue-action@v1
        with:
          title: "Security scan issues for ${{ "{{" }} steps.get_tag.outputs.release }}"
          body: |
            ## Vulnerabilities found
            ```
            ${{ "{{" }} steps.scan-output.outputs.stdout }}
            ```
          unique-title-includes: "Security scan issues for "
          close: ${{ "{{" }} steps.scan.outcome == 'success' }}
