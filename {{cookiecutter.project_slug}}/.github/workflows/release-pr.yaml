name: Release PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ "{{" }} github.workflow }}-${{ "{{" }} github.event.number }}
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: {{ cookiecutter.github_workflow_runs_on }}

    permissions:
      contents: read
      pull-requests: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: $/.github/actions/setup_environment

      - name: Get Image Data
        id: get-image-data
        run: |
          {
            echo "registry=ghcr.io"
            echo "name=${{ "{{" }} github.repository }}-beta"
            echo "tag=${{ "{{" }} github.event.number }}-${{ "{{" }} github.run_id }}-${{ "{{" }} github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ "{{" }} github.actor }}
          password: ${{ "{{" }} secrets.GITHUB_TOKEN }}

      - name: Configure Docker Builder
        run: task configure-builder

      - name: Build image
        env:
          IMAGE_REGISTRY: ${{ "{{" }} steps.get-image-data.outputs.registry }}
          IMAGE_NAME: ${{ "{{" }} steps.get-image-data.outputs.name }}
          IMAGE_TAG: ${{ "{{" }} steps.get-image-data.outputs.tag }}
        run: |
          task ci-image-push

      - name: Scan image
        id: scan
        uses: ovsds/run-with-output-action@9bc0dcb1df5b70d1704c709f9cc0f40d260a5f40 # v1.4.0
        continue-on-error: true
        with:
          run: |
            IMAGE_REGISTRY="${{ "{{" }} steps.get-image-data.outputs.registry }}" \
            IMAGE_NAME="${{ "{{" }} steps.get-image-data.outputs.name }}" \
            IMAGE_TAG="${{ "{{" }} steps.get-image-data.outputs.tag }}" \
            task ci-image-scan

      - name: Report vulnerabilities
        uses: ovsds/create-or-update-unique-comment-action@df30f5f96aa71679deb9eb697c98f39ee9e26651 # v1.1.0
        with:
          issue-number: ${{ "{{" }} github.event.number }}
          body: |
            ## Vulnerabilities found
            ```
            ${{ "{{" }} steps.scan.outputs.stdout }}
            ```
          unique-body-includes: "## Vulnerabilities found"
          delete: ${{ "{{" }} steps.scan.outputs.exit_code == 0 }}
