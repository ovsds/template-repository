name: Release PR

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: ${{ "{{" }} github.workflow }}-${{ "{{" }} github.event.number }}
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: {{ cookiecutter.github_workflow_runs_on }}

    permissions:
      contents: read
      pull-requests: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get Image Data
        id: get-image-data
        run: |
          {
            echo "registry=ghcr.io"
            echo "name=${{ "{{" }} github.repository }}-beta"
            echo "tag=${{ "{{" }} github.event.number }}-${{ "{{" }} github.run_id }}-${{ "{{" }} github.run_attempt }}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ "{{" }} github.actor }}
          password: ${{ "{{" }} secrets.GITHUB_TOKEN }}

      - name: Build + push image
        uses: devcontainers/ci@v0.3
        env:
          IMAGE_REGISTRY: ${{ "{{" }} steps.get-image-data.outputs.registry }}
          IMAGE_NAME: ${{ "{{" }} steps.get-image-data.outputs.name }}
          IMAGE_TAG: ${{ "{{" }} steps.get-image-data.outputs.tag }}
        with:
          runCmd: |
            task configure-builder
            task ci-image-push
          env: |
            IMAGE_REGISTRY
            IMAGE_NAME
            IMAGE_TAG

      - name: Scan image
        id: scan
        continue-on-error: true
        uses: devcontainers/ci@v0.3
        env:
          IMAGE_REGISTRY: ${{ "{{" }} steps.get-image-data.outputs.registry }}
          IMAGE_NAME: ${{ "{{" }} steps.get-image-data.outputs.name }}
          IMAGE_TAG: ${{ "{{" }} steps.get-image-data.outputs.tag }}
        with:
          runCmd: |
            task ci-image-scan | tee scan-output.txt
          env: |
            IMAGE_REGISTRY
            IMAGE_NAME
            IMAGE_TAG

      - name: Capture scan output
        id: scan-output
        if: always()
        run: |
          {
            echo 'stdout<<EOF'
            cat scan-output.txt 2>/dev/null || echo "(scan output unavailable)"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Report vulnerabilities
        uses: ovsds/create-or-update-unique-comment-action@v1
        with:
          issue-number: ${{ "{{" }} github.event.number }}
          body: |
            ## Vulnerabilities found
            ```
            ${{ "{{" }} steps.scan-output.outputs.stdout }}
            ```
          unique-body-includes: "## Vulnerabilities found"
          delete: ${{ "{{" }} steps.scan.outcome == 'success' }}
