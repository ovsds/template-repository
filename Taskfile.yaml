version: 3

silent: true

vars:
  NENV: "node_modules"
  TEST_RESULTS: ".test_results"

tasks:
  _prettier:
    internal: true
    cmds:
      - "{{.NENV}}/.bin/prettier {{.COMMAND}}"

  init:
    desc: Initialize project environment
    cmds:
      - echo 'Installing mise tools...'
      - mise install

      - echo 'Installing node dependencies...'
      - npm install

      - echo 'Installing husky pre-commit...'
      - npm run prepare

  lint:
    desc: Lint project
    cmds:
      - echo 'Running prettier checks...'
      - task: _prettier
        vars: { COMMAND: "--check ." }

      - echo 'Running GHA checks...'
      - GH_TOKEN="$(gh auth token)" zizmor .github/*

      - echo 'Running secret scan...'
      - gitleaks git --log-opts=HEAD --redact --no-banner

  lint-fix:
    desc: Lint fix project
    cmds:
      - echo 'Running prettier fixes...'
      - task: _prettier
        vars: { COMMAND: "--write ." }

      - echo 'Running GHA checks...'
      - GH_TOKEN="$(gh auth token)" zizmor .github/*

      - echo 'Running secret scan...'
      - gitleaks git --log-opts=HEAD --redact --no-banner

  test:
    desc: Test project
    cmds:
      - echo 'Running tests...'
      - python -m tests

  clean:
    desc: Clean project environment
    cmds:
      - echo 'Cleaning node dependencies...'
      - rm -rf {{.NENV}}

      - echo 'Cleaning test results...'
      - rm -rf {{.TEST_RESULTS}}

  dependencies-update:
    desc: Update dependencies
    cmds:
      - echo 'Updating mise tools...'
      - mise upgrade --bump

      - echo 'Updating node dependencies...'
      - npm update

  dependencies-check:
    desc: Check dependencies
    cmds:
      - echo 'Checking mise tools...'
      - mise outdated

      - echo 'Checking node dependencies...'
      - npm outdated
      - npm audit

  update-from-template:
    desc: Update project from template
    cmds:
      - echo 'Updating project from template...'
      - cookiecutter
        --no-input
        --overwrite-if-exists
        --output-dir ../
        {{.TEMPLATE_PATH}}
        project_name='Cookiecutter Template for GitHub Repository'
        project_slug='template-repository'
        node_version='v21.5.0'
        owner_name='Dmitry Ovsiannikov'
        owner_github_login='ovsds'
        scripts='false'
        services=''
        with_python='true'
        with_cookiecutter='true'
        with_trivy='false'
        with_zizmor='true'
        with_gitleaks='true'
        with_docker='false'
        with_build='false'
    vars:
      TEMPLATE_PATH: '{{.TEMPLATE_PATH | default "."}}'
