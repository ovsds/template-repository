# lint and lint-fix fail when run twice in one run, as they would if the root also fanned out to this nested service
[tasks.init]
run = "echo 'parent/child:init'"

[tasks.lint]
run = "mkdir .lint-ran"

[tasks.lint-fix]
run = "mkdir .lint-fix-ran"

[tasks.test]
run = "echo 'parent/child:test'"

[tasks.clean]
run = "echo 'parent/child:clean'"

[tasks.dependencies-update]
run = "echo 'parent/child:dependencies-update'"

[tasks.dependencies-check]
run = "echo 'parent/child:dependencies-check'"
